<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star rating with a wanted level</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 20% 80%, #ff2d8a55, transparent 45%), radial-gradient(circle at 85% 20%, #12d6c955, transparent 45%), #0b0d1a;
    font-family: system-ui, sans-serif; }

  .rate { text-align: center; }
  h2 { margin: 0 0 22px; font: 800 30px system-ui; letter-spacing: -.01em; }
  .stars { display: flex; gap: 10px; justify-content: center; }
  .star { width: 64px; height: 64px; padding: 0; border: 0; background: none; cursor: pointer; }
  .star svg { width: 100%; height: 100%; fill: transparent; stroke: #ffffffaa; stroke-width: 2.2; stroke-linejoin: round; }
  .on svg { fill: #fff; stroke: #fff; filter: drop-shadow(0 0 10px #fff); animation: pop .3s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { from { scale: .3 } }
  .msg { margin: 22px 0 0; font: 700 22px system-ui; color: #ff4d6d; opacity: 0; transition: opacity .3s; }

  /* Five stars = maximum wanted level: the stars blink and the edges flash like a police light. */
  .siren { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  .wanted .siren { animation: siren .5s steps(1) infinite; }
  .wanted .on svg { animation: blink .5s steps(1) infinite; }
  .wanted .msg { opacity: 1; }
  @keyframes siren { 0% { opacity: 1; box-shadow: inset 0 0 140px 30px #ff1f3d } 50% { opacity: 1; box-shadow: inset 0 0 140px 30px #1f5bff } }
  @keyframes blink { 50% { opacity: .35 } }
</style>
</head>
<body>
  <div class="siren"></div>
  <div class="rate">
    <h2>Rate your driver</h2>
    <div class="stars" id="stars"></div>
    <p class="msg">5 stars. Now they're after you. 🚨</p>
  </div>

<script>
  const box = document.getElementById('stars');
  const star = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
  const stars = [];

  for (let i = 0; i < 5; i++) {
    const b = document.createElement('button');
    b.className = 'star';
    b.id = 's' + (i + 1);
    b.innerHTML = star;
    b.addEventListener('click', () => rate(i + 1));
    box.append(b);
    stars.push(b);
  }

  let busy = false;
  function rate(n) {
    if (busy) return;
    busy = true;
    stars.forEach((s, k) => k < n && setTimeout(() => s.classList.add('on'), k * 160));
    if (n === 5) setTimeout(() => document.body.classList.add('wanted'), 5 * 160 + 100);
    setTimeout(() => {
      document.body.classList.remove('wanted');
      stars.forEach((s) => s.classList.remove('on'));
      busy = false;
    }, 3600);
  }
</script>
</body>
</html>
