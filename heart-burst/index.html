<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like button that bursts into hearts</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fff1f3; font-family: system-ui, sans-serif; }

  .like { position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 30px 18px 22px;
    border: 0; border-radius: 999px; background: #fff; cursor: pointer;
    box-shadow: 0 10px 30px #e0315a22; font: 800 30px system-ui; color: #3a2a2e; }

  .heart { position: relative; width: 48px; height: 48px; }
  .heart svg { width: 48px; height: 48px; fill: #d8cfd2; transition: fill .2s; }
  .liked .heart svg { fill: #ff2d55; animation: pump .45s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pump { 0% { scale: .2 } 100% { scale: 1 } }

  .ring { position: absolute; inset: -14px; border-radius: 50%; border: 6px solid #ff2d55; opacity: 0; }
  .liked .ring { animation: ring .5s ease-out; }
  @keyframes ring { 0% { opacity: 1; scale: .2 } 100% { opacity: 0; scale: 1.4; border-width: 0 } }

  .bits i { position: absolute; left: 18px; top: 18px; width: 12px; height: 12px; opacity: 0;
    background: #ff2d55; clip-path: path('M6 11 L1 6 A2.6 2.6 0 0 1 6 2 A2.6 2.6 0 0 1 11 6 Z'); }
  .liked .bits i { animation: fly .7s ease-out; }
  @keyframes fly { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(.6) }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-70px) scale(1.4) } }

  .count { height: 36px; overflow: hidden; line-height: 36px; }
  .count span { display: block; transition: translate .35s cubic-bezier(.3, 1.4, .5, 1); }
  .liked .count span { translate: 0 -36px; }
</style>
</head>
<body>
  <button class="like" id="like">
    <span class="heart">
      <span class="ring"></span>
      <span class="bits"></span>
      <svg viewBox="0 0 24 24"><path d="M12 21 L3.5 12.5 A5 5 0 0 1 12 5.5 A5 5 0 0 1 20.5 12.5 Z"/></svg>
    </span>
    <span class="count"><span>128</span><span>129</span></span>
  </button>

<script>
  const like = document.getElementById('like');
  const bits = like.querySelector('.bits');

  for (let i = 0; i < 10; i++) {
    const bit = document.createElement('i');
    bit.style.setProperty('--a', i * 36 + 'deg');
    bits.append(bit);
  }

  like.addEventListener('click', () => like.classList.toggle('liked'));
</script>
</body>
</html>
