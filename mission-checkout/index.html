<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout with a mission-complete screen</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 50% 45%, #3a2a0a, #0d0d12 65%); font-family: system-ui, sans-serif; }

  .shop { position: relative; width: 380px; height: 360px; display: grid; place-items: center; }

  .card { width: 300px; padding: 26px; border-radius: 22px; background: #1b1b24; box-shadow: 0 20px 50px #0008;
    text-align: center; transition: scale .3s, opacity .3s; }
  .card p { margin: 0; color: #9a9aac; font: 600 18px system-ui; }
  .card h3 { margin: 6px 0 20px; font: 900 44px system-ui; }
  .pay { width: 100%; height: 64px; border: 0; border-radius: 16px; cursor: pointer;
    background: #2fbf71; color: #fff; font: 800 24px system-ui; }

  /* The big banner: letters slam together, then the cash counter rolls up. */
  .banner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .banner h2 { margin: 0; color: #ffcf3a; font: 900 52px/1 system-ui; text-transform: uppercase;
    -webkit-text-stroke: 2px #000; text-shadow: 0 6px 0 #000; letter-spacing: .6em; opacity: 0;
    transition: letter-spacing .45s cubic-bezier(.2, .9, .3, 1), opacity .2s; }
  .banner b { margin-top: 14px; color: #5dff9b; font: 900 40px system-ui; -webkit-text-stroke: 1.5px #000; opacity: 0; transition: opacity .2s; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  .done .card { scale: .85; opacity: 0; }
  .done .banner h2 { letter-spacing: .02em; opacity: 1; }
  .done .banner b { opacity: 1; transition-delay: .4s; }
  .done .flash { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: .8 } 100% { opacity: 0 } }
</style>
</head>
<body>
  <div class="shop" id="shop">
    <div class="card">
      <p>Order total</p>
      <h3>$2,500</h3>
      <button class="pay" id="pay">Complete order</button>
    </div>
    <div class="banner"><h2>Order<br>complete</h2><b id="cash">+$0</b></div>
    <div class="flash"></div>
  </div>

<script>
  const shop = document.getElementById('shop');
  const cash = document.getElementById('cash');

  function countTo(total, ms) {
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / ms);
      cash.textContent = '+$' + Math.round(total * p).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  document.getElementById('pay').addEventListener('click', () => {
    if (shop.className !== 'shop') return;
    shop.classList.add('done');
    setTimeout(() => countTo(2500, 900), 400);
    setTimeout(() => { shop.className = 'shop'; cash.textContent = '+$0'; }, 3200);
  });
</script>
</body>
</html>
