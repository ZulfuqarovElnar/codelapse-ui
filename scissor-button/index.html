<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scissor-cut Book button</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f3ece1; font-family: system-ui, sans-serif; }

  .book { position: relative; width: 340px; height: 96px; }

  .half { position: absolute; inset: 0; border: 0; border-radius: 48px;
    background: #c8321f; color: #fff; font: 800 30px/96px system-ui;
    letter-spacing: .02em; cursor: pointer;
    transition: transform .9s cubic-bezier(.5, 0, .9, .4), opacity .4s .55s; }
  .top { clip-path: inset(0 0 50% 0); }
  .bottom { clip-path: inset(50% 0 0 0); }

  .scissors { position: absolute; left: -110px; top: 9px; width: 96px; z-index: 2;
    opacity: 0; pointer-events: none; }
  .blade { transform-origin: 26px 26px; }

  .cut .scissors { animation: snip .9s linear forwards; }
  .cut .blade.a { animation: open .15s 6 alternate; }
  .cut .blade.b { animation: open-b .15s 6 alternate; }
  .fall .top { transform: translate(-50px, 160px) rotate(-24deg); opacity: 0; }
  .fall .bottom { transform: translate(60px, 220px) rotate(28deg); opacity: 0; }

  .book::after { content: ''; position: absolute; left: 0; top: 47px; height: 2px; width: 0;
    background: #fff; z-index: 1; }
  .cut::after { animation: line .8s .08s linear forwards; }
  .fall::after { opacity: 0; }
  @keyframes line { to { width: 100% } }

  @keyframes snip { 10% { opacity: 1 } 90% { opacity: 1 } to { left: 380px; opacity: 0 } }
  @keyframes open { to { transform: rotate(-18deg) } }
  @keyframes open-b { to { transform: rotate(18deg) } }

  .done { position: absolute; inset: 0; display: grid; place-items: center;
    border-radius: 24px; background: #1d1a17; color: #f3ece1;
    font: 700 24px/1.3 system-ui; text-align: center;
    scale: .6; opacity: 0; transition: scale .4s cubic-bezier(.3, 1.6, .5, 1), opacity .3s; }
  .done b { color: #6fd38a; font-size: 30px; }
  .booked .done { scale: 1; opacity: 1; }
</style>
</head>
<body>
  <div class="book" id="book">
    <button class="half top">Book a chair ✂</button>
    <button class="half bottom">Book a chair ✂</button>
    <svg class="scissors" viewBox="0 0 64 52">
      <g class="blade a"><path d="M26 26 L62 18 L60 24 Z" fill="#d9d9d9"/><circle cx="10" cy="16" r="8" fill="none" stroke="#1d1a17" stroke-width="5"/><path d="M16 20 L26 26" stroke="#1d1a17" stroke-width="5"/></g>
      <g class="blade b"><path d="M26 26 L62 34 L60 28 Z" fill="#bdbdbd"/><circle cx="10" cy="36" r="8" fill="none" stroke="#1d1a17" stroke-width="5"/><path d="M16 32 L26 26" stroke="#1d1a17" stroke-width="5"/></g>
    </svg>
    <div class="done"><div><b>✓ Booked</b><br>Sat · 14:30 · Skin fade</div></div>
  </div>

<script>
  const book = document.getElementById('book');

  book.addEventListener('click', () => {
    if (book.className !== 'book') return;
    book.classList.add('cut');
    setTimeout(() => book.classList.add('fall'), 650);
    setTimeout(() => book.classList.add('booked'), 1100);
    setTimeout(() => (book.className = 'book'), 3200);
  });
</script>
</body>
</html>
