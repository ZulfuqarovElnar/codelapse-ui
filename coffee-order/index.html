<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order button that brews itself</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #efe6da; font-family: system-ui, sans-serif; }

  .order { position: relative; width: 300px; height: 230px; display: grid; place-items: center; }

  .btn { border: 0; padding: 22px 36px; border-radius: 999px; cursor: pointer;
    background: #3b2418; color: #f6ead8; font: 800 26px system-ui;
    transition: scale .35s, opacity .25s; }
  .brew .btn { scale: 0; opacity: 0; }

  .cup { position: absolute; left: 75px; top: 40px; width: 150px; height: 150px;
    border: 10px solid #3b2418; border-top: 0; border-radius: 0 0 46px 46px;
    overflow: hidden; background: #fffaf2;
    scale: .3; opacity: 0; transition: scale .45s .15s cubic-bezier(.3, 1.5, .5, 1), opacity .3s .15s; }
  .handle { position: absolute; left: 222px; top: 70px; width: 44px; height: 62px;
    border: 10px solid #3b2418; border-left: 0; border-radius: 0 30px 30px 0;
    opacity: 0; transition: opacity .3s .3s; }
  .brew .cup { scale: 1; opacity: 1; }
  .brew .handle { opacity: 1; }

  /* The liquid is a big spinning rounded square: its top edge looks like a wave. */
  .liquid, .foam { position: absolute; left: -75px; top: 175px; width: 300px; height: 300px;
    border-radius: 42%; animation: spin 2.4s linear infinite;
    transition: top 2s .45s ease-in-out; }
  .foam { background: #e9cfa6; animation-duration: 3.1s; }
  .liquid { background: #7a4628; margin-top: 14px; }
  .brew .foam { top: 18px; }
  .brew .liquid { top: 18px; }
  @keyframes spin { to { rotate: 360deg } }

  .steam { position: absolute; left: 112px; top: -30px; display: flex; gap: 18px; }
  .steam i { width: 10px; height: 52px; border-radius: 8px; background: #3b241899; opacity: 0; }
  .ready .steam i { animation: rise 1.4s ease-out infinite; }
  .ready .steam i:nth-child(2) { animation-delay: .35s; }
  .ready .steam i:nth-child(3) { animation-delay: .7s; }
  @keyframes rise { 0% { translate: 0 30px; opacity: 0 } 40% { opacity: 1 } 100% { translate: 0 -30px; opacity: 0 } }

  .note { position: absolute; top: 215px; left: 0; right: 0; text-align: center;
    color: #3b2418; font: 700 22px system-ui; opacity: 0; translate: 0 10px;
    transition: opacity .3s, translate .3s; }
  .note b { color: #b0562a; }
  .ready .note { opacity: 1; translate: 0 0; }
</style>
</head>
<body>
  <div class="order" id="order">
    <button class="btn">Order a latte ☕</button>
    <div class="steam"><i></i><i></i><i></i></div>
    <div class="cup"><div class="foam"></div><div class="liquid"></div></div>
    <div class="handle"></div>
    <p class="note"><b>Ready!</b> Latte for Anna</p>
  </div>

<script>
  const order = document.getElementById('order');

  order.addEventListener('click', () => {
    if (order.className !== 'order') return;
    order.classList.add('brew');
    setTimeout(() => order.classList.add('ready'), 2400);
    setTimeout(() => (order.className = 'order'), 4700);
  });
</script>
</body>
</html>
