<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blow out the candle for dark mode</title>
<style>
  :root { --bg: #f6efe4; --ink: #2a211b; --muted: #7b6c60; }
  .dark { --bg: #14110f; --ink: #f3e9dc; --muted: #a39282; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 0;
    background: var(--bg); color: var(--ink); font-family: Georgia, serif;
    transition: background .8s, color .8s; }
  .wrap { display: flex; align-items: center; gap: 46px; }
  h1 { margin: 0; font-size: 44px; line-height: 1.05; }
  p { margin: 10px 0 0; color: var(--muted); font: 18px/1.4 system-ui; transition: color .8s; }

  .candle { position: relative; width: 60px; height: 190px; cursor: pointer; }
  .wax { position: absolute; bottom: 0; left: 8px; width: 44px; height: 110px; border-radius: 6px 6px 4px 4px;
    background: linear-gradient(90deg, #f2e6d0, #fffaf0 40%, #e3d3b8); }
  .wick { position: absolute; bottom: 110px; left: 28px; width: 4px; height: 14px; border-radius: 2px; background: #2a211b; }
  .flame { position: absolute; bottom: 120px; left: 15px; width: 30px; height: 52px; transform-origin: 50% 90%;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 50% 75%, #fff 0 18%, #ffd23f 40%, #ff7a1a 90%);
    box-shadow: 0 0 40px 14px #ffb84d66;
    animation: flicker .18s infinite alternate; transition: scale .35s, opacity .35s; }
  @keyframes flicker { to { rotate: 3deg; scale: .96 1.05 } }

  .dark .flame { scale: 0; opacity: 0; }
  .smoke { position: absolute; bottom: 124px; left: 22px; }
  .smoke i { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #9a9a9a; opacity: 0; }
  .dark .smoke i { animation: puff 1.4s ease-out; }
  .dark .smoke i:nth-child(2) { animation-delay: .15s; }
  .dark .smoke i:nth-child(3) { animation-delay: .3s; }
  @keyframes puff { 0% { opacity: .7; translate: 0 0; scale: .6 } 100% { opacity: 0; translate: 14px -90px; scale: 2.4 } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="candle" id="candle">
      <div class="smoke"><i></i><i></i><i></i></div>
      <div class="flame"></div><div class="wick"></div><div class="wax"></div>
    </div>
    <div>
      <h1>Good<br>evening.</h1>
      <p>Blow out the candle<br>to turn the lights off.</p>
    </div>
  </div>

<script>
  document.getElementById('candle').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
  });
</script>
</body>
</html>
