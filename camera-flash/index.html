<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap button that prints a polaroid</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #e9e4dc; font-family: system-ui, sans-serif; overflow: hidden; }

  .cam { position: relative; width: 230px; height: 370px; cursor: pointer; }

  .body { position: absolute; top: 0; width: 230px; height: 150px; z-index: 2;
    border-radius: 26px; background: linear-gradient(#2a2a2e, #161618);
    box-shadow: 0 14px 30px #0004; }
  .body::before { content: 'SNAP'; position: absolute; left: 18px; top: 16px;
    color: #f0c84a; font: 900 15px system-ui; letter-spacing: .2em; }
  .bulb { position: absolute; right: 20px; top: 16px; width: 44px; height: 24px;
    border-radius: 6px; background: #f6f1e4; }
  .lens { position: absolute; left: 70px; top: 30px; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #6d7cff 0 8px, #1d2340 9px 26px, #0b0d18 27px);
    box-shadow: 0 0 0 9px #3a3a40, 0 0 0 13px #1c1c20; }

  /* The photo waits inside a clipped slot under the camera and slides out of it. */
  .slot { position: absolute; left: 24px; top: 140px; width: 182px; height: 230px; overflow: hidden; z-index: 1; }
  .photo { margin: 0 6px; padding: 10px 10px 34px; background: #fbfaf7; box-shadow: 0 6px 14px #0002;
    translate: 0 -100%; transition: translate 1.2s cubic-bezier(.3, .8, .3, 1); }
  .shot { height: 150px; overflow: hidden; position: relative;
    background: linear-gradient(#ff8a5b, #ffc36b 55%, #ffe1a8);
    filter: grayscale(1) brightness(1.7) blur(5px);
    transition: filter 2s .9s; }
  .shot::before { content: ''; position: absolute; left: 52px; top: 48px; width: 56px; height: 56px;
    border-radius: 50%; background: #fff3c9; }
  .shot::after { content: ''; position: absolute; inset: auto 0 0; height: 70px; background: #3e2f5b;
    clip-path: polygon(0 60%, 25% 15%, 45% 55%, 70% 5%, 100% 50%, 100% 100%, 0 100%); }
  .print .photo { translate: 0 0; }
  .print .shot { filter: none; }

  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }
  .snap .flash { animation: flash .6s ease-out; }
  .snap .body { animation: click .25s; }
  @keyframes flash { 0% { opacity: 0 } 8% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes click { 50% { scale: .95 } }
</style>
</head>
<body>
  <div class="cam" id="cam">
    <div class="slot"><div class="photo"><div class="shot"></div></div></div>
    <div class="body"><div class="bulb"></div><div class="lens"></div></div>
    <div class="flash"></div>
  </div>

<script>
  const cam = document.getElementById('cam');

  cam.addEventListener('click', () => {
    if (cam.className !== 'cam') return;
    cam.classList.add('snap');
    setTimeout(() => cam.classList.add('print'), 350);
    setTimeout(() => (cam.className = 'cam'), 4400);
  });
</script>
</body>
</html>
