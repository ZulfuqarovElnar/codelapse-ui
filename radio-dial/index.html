<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car radio station switcher</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(#2a0f3d, #0b0614); font-family: system-ui, sans-serif; }

  .radio { width: 380px; padding: 24px; border-radius: 26px; background: linear-gradient(#26222e, #141218);
    box-shadow: 0 24px 60px #000a, inset 0 1px 0 #ffffff14; display: flex; align-items: center; gap: 22px; }

  .screen { position: relative; flex: 1; height: 150px; padding: 16px; box-sizing: border-box; border-radius: 14px;
    background: #071a17; color: #39ffc8; overflow: hidden; }
  .name { font: 900 26px/1.1 system-ui; letter-spacing: .02em; }
  .freq { margin-top: 4px; font: 600 18px ui-monospace, monospace; opacity: .7; }
  .eq { position: absolute; left: 16px; right: 16px; bottom: 14px; height: 40px; display: flex; gap: 6px; align-items: flex-end; }
  .eq i { flex: 1; height: 100%; border-radius: 3px; background: currentColor; transform-origin: bottom;
    animation: eq .5s ease-in-out infinite alternate; }
  .eq i:nth-child(2n) { animation-duration: .35s; }
  .eq i:nth-child(3n) { animation-duration: .6s; }
  @keyframes eq { from { scale: 1 .2 } to { scale: 1 1 } }

  /* Static between stations. */
  .screen::after { content: ''; position: absolute; inset: 0; opacity: 0;
    background: repeating-linear-gradient(0deg, #fff3 0 2px, transparent 2px 4px), #0b2b26; }
  .tuning .screen::after { opacity: 1; animation: static .08s steps(2) infinite; }
  @keyframes static { 50% { background-position: 0 3px } }

  .knob { position: relative; width: 96px; height: 96px; border: 0; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 40% 35%, #5a5566, #24212b 70%); box-shadow: 0 8px 20px #0009, 0 0 0 6px #0c0b0f;
    transition: rotate .4s cubic-bezier(.3, 1.5, .5, 1); }
  .knob::after { content: ''; position: absolute; left: 44px; top: 8px; width: 8px; height: 26px; border-radius: 4px; background: #39ffc8; }
</style>
</head>
<body>
  <div class="radio" id="radio">
    <div class="screen"><div class="name" id="name">NEON FM</div><div class="freq" id="freq">103.5</div>
      <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <button class="knob" id="knob" aria-label="Next station"></button>
  </div>

<script>
  const stations = [['NEON FM', '103.5', '#39ffc8'], ['PALM WAVES', '88.1', '#ff6ad5'], ['NIGHT DRIVE', '97.3', '#ffd23f']];
  const radio = document.getElementById('radio');
  const knob = document.getElementById('knob');
  const screen = radio.querySelector('.screen');
  let current = 0, turns = 0;

  knob.addEventListener('click', () => {
    turns++;
    knob.style.rotate = turns * 120 + 'deg';
    radio.classList.add('tuning');
    setTimeout(() => {
      current = (current + 1) % stations.length;
      const [name, freq, color] = stations[current];
      document.getElementById('name').textContent = name;
      document.getElementById('freq').textContent = freq;
      screen.style.color = color;
      radio.classList.remove('tuning');
    }, 350);
  });
</script>
</body>
</html>
