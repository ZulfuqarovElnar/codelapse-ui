<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game-style phone that slides up</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; font-family: system-ui, sans-serif;
    background: radial-gradient(circle at 50% 120%, #ff5e8a55, transparent 60%), linear-gradient(#24103a, #0b0614); }

  .open { position: fixed; bottom: 60px; padding: 18px 34px; border: 0; border-radius: 40px; cursor: pointer;
    background: #ff3d9a; color: #fff; font: 800 26px system-ui; transition: scale .3s, opacity .3s; }

  /* The phone waits below the screen, tilted, and springs up when the page gets .up */
  .phone { position: fixed; bottom: 24px; width: 250px; height: 500px; padding: 12px; box-sizing: border-box;
    border-radius: 40px; background: #0b0b10; box-shadow: 0 30px 70px #000c, inset 0 0 0 2px #ffffff22;
    translate: 0 130%; rotate: -10deg; transition: translate .6s cubic-bezier(.2, 1.3, .4, 1), rotate .6s; }
  .screen { position: relative; height: 100%; border-radius: 30px; overflow: hidden; color: #fff; filter: brightness(0);
    background: linear-gradient(#ff7a45, #ff3d9a 45%, #3a1450); transition: filter .4s .35s; }
  .time { margin: 88px 0 0; text-align: center; font: 800 62px/1 system-ui; letter-spacing: -.03em; }
  .date { margin: 4px 0 26px; text-align: center; font: 600 15px system-ui; opacity: .85; }

  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 20px; }
  .apps i { aspect-ratio: 1; display: grid; place-items: center; border-radius: 16px; font-size: 28px; font-style: normal;
    background: #ffffff2e; scale: 0; transition: scale .35s cubic-bezier(.3, 1.6, .5, 1) calc(.5s + var(--n) * .05s); }

  .note { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 10px; align-items: center;
    padding: 10px 12px; border-radius: 18px; background: #fffffff0; color: #1b0828; font: 600 13px/1.3 system-ui;
    translate: 0 -130%; transition: translate .4s cubic-bezier(.2, 1.4, .4, 1); }
  .note b { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; background: #ff3d9a; color: #fff; }

  .up .open { scale: .6; opacity: 0; }
  .up .phone { translate: 0 0; rotate: 0deg; }
  .up .screen { filter: brightness(1); }
  .up .apps i { scale: 1; }
  .ping .note { translate: 0 0; }
</style>
</head>
<body>
  <button class="open" id="open">📱 Phone</button>
  <div class="phone">
    <div class="screen">
      <div class="note"><b>K</b><span><strong>Kai</strong> · now<br>Meet me at the pier 🌴</span></div>
      <p class="time">21:47</p><p class="date">Saturday, 28 November</p>
      <div class="apps" id="apps"></div>
    </div>
  </div>

<script>
  // Each icon gets its index as --n, so the pop-in is staggered by CSS alone.
  const apps = ['📞', '💬', '📷', '🗺️', '🎵', '🌐', '📧', '🎮', '⚙️'];
  document.getElementById('apps').innerHTML = apps.map((a, n) => `<i style="--n:${n}">${a}</i>`).join('');

  const page = document.body;
  document.getElementById('open').addEventListener('click', () => {
    if (page.classList.contains('up')) return;
    page.classList.add('up');
    setTimeout(() => page.classList.add('ping'), 1300); // a message arrives
    setTimeout(() => page.classList.remove('ping'), 3000);
    setTimeout(() => page.classList.remove('up'), 3300); // phone goes back down
  });
</script>
</body>
</html>
