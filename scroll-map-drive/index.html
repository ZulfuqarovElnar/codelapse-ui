<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll to drive: a GPS route in pure CSS</title>
<style>
  body { margin: 0; height: 500vh; background: #0b0614; color: #fff; font-family: system-ui, sans-serif; }
  .scene { position: sticky; top: 0; height: 100vh; overflow: hidden; perspective: 900px;
    background: radial-gradient(120% 70% at 50% 0%, #3a1450, #0b0614 70%); }

  /* Everything here follows the page scroll. Longhands only: the animation shorthand would reset the timeline. */
  .scene * { animation-timeline: scroll(root); animation-timing-function: linear; animation-fill-mode: both; }

  /* The map lies tilted in 3D. Its top-left corner sits in the middle of the screen,
     and the camera keyframes slide it so the car's point is always there. */
  .tilt { position: absolute; left: 50%; top: 58%; transform: rotateX(52deg) scale(1.25); transform-style: preserve-3d; }
  .map { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; animation-name: camera; }
  @keyframes camera {
    0.00% { translate: -140px -900px }
    13.38% { translate: -140px -700px }
    26.76% { translate: -340px -700px }
    40.13% { translate: -340px -500px }
    53.51% { translate: -540px -500px }
    66.89% { translate: -540px -300px }
    80.27% { translate: -740px -300px }
    93.65% { translate: -740px -100px }
    100.00% { translate: -835px -100px }
  }
  .map svg { position: absolute; inset: 0; }

  /* The streets are two repeating gradients: a road every 200px, both ways. The sea covers the right. */
  .land { position: absolute; inset: -800px; background: #2e1942;
    background-image: linear-gradient(90deg, #4b3163 16px, transparent 0), linear-gradient(#4b3163 16px, transparent 0);
    background-size: 200px 200px; background-position: 132px 0, 0 92px; }
  .sea { fill: #123a5c; stroke: #f2b880; stroke-width: 16; }
  .park { fill: #1f4a3f; }
  .avenue { stroke: #4b3163; stroke-width: 16; }

  /* The route ahead of the car, in GPS magenta: the dash starts at the car and runs to the end.
     pathLength="1" lets the offset go from 0 to -1 whatever the real length is. */
  .route { fill: none; stroke: #ff3d9a; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1 1; filter: drop-shadow(0 0 8px #ff3d9a); animation-name: eat; }
  @keyframes eat { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1 } }

  /* The car drives the same path with offset-path; offset-rotate turns it into each corner. */
  .car { position: absolute; left: 0; top: 0; width: 26px; height: 44px; margin: -22px 0 0 -13px; border-radius: 9px;
    background: linear-gradient(#ffd25a, #ff7a45); box-shadow: 0 0 0 3px #0b0614, 0 0 24px #ffd25a;
    offset-path: path('M140 900 L140 700 L340 700 L340 500 L540 500 L540 300 L740 300 L740 100 L835 100'); offset-rotate: auto 90deg; offset-anchor: center; animation-name: drive; }
  .car::before { content: ''; position: absolute; left: 4px; right: 4px; top: 9px; height: 9px; border-radius: 3px; background: #0b0614aa; }
  @keyframes drive { from { offset-distance: 0% } to { offset-distance: 100% } }

  .pin { position: absolute; left: 872px; top: 100px; width: 34px; height: 34px; margin: -40px 0 0 -17px; border-radius: 50% 50% 50% 0;
    background: #ffd25a; rotate: -45deg; box-shadow: 0 0 20px #ffd25a; }

  /* The HUD: distance left counts down with a typed integer custom property and a CSS counter. */
  @property --m { syntax: '<integer>'; inherits: false; initial-value: 2390; }
  .hud { position: absolute; left: 50%; top: 5vh; translate: -50% 0; display: flex; gap: 10px; align-items: center; white-space: nowrap;
    padding: 10px 18px; border-radius: 14px; background: #0b0614cc; box-shadow: inset 0 0 0 2px #ff3d9a; font: 800 18px system-ui; }
  .hud b { color: #ff3d9a; }
  .hud i { font-style: normal; color: #ffd25a; counter-reset: m var(--m); animation-name: count; }
  .hud i::after { content: counter(m) " m"; }
  @keyframes count { to { --m: 0 } }

  .arrived { position: absolute; left: 0; right: 0; top: 17%; margin: 0; text-align: center; font: 900 clamp(34px, 9vw, 64px)/1 system-ui; letter-spacing: -.02em;
    text-transform: uppercase; color: transparent; background: linear-gradient(90deg, #ff3d9a, #ff7a45, #ffd25a); -webkit-background-clip: text; background-clip: text;
    animation-name: arrive; animation-range: 90% 98%; }
  .arrived small { display: block; margin-top: 8px; font: 600 16px ui-monospace, monospace; color: #ffb0d9; letter-spacing: 0; text-transform: none; }
  @keyframes arrive { from { opacity: 0; scale: .6 } }
  .hint { position: absolute; left: 0; right: 0; bottom: 3vh; margin: 0; text-align: center; font: 700 14px system-ui; letter-spacing: .25em; color: #ffffff99;
    animation-name: fade; animation-range: 0% 8%; }
  @keyframes fade { to { opacity: 0 } }
</style>
</head>
<body>
  <section class="scene">
    <div class="tilt">
      <div class="map">
        <div class="land"></div>
        <svg viewBox="0 0 1000 1000" width="1000" height="1000" overflow="visible">
          <path class="sea" d="M870 -800 C850 -400 900 -200 860 0 C900 150 850 300 880 420 C930 600 880 800 900 1000 C920 1300 870 1500 890 1800 H2000 V-800 Z"/>
          <rect class="park" x="362" y="522" width="156" height="156" rx="14"/>
          <path class="avenue" d="M140 300 L540 700"/>
          <path class="route" pathLength="1" d="M140 900 L140 700 L340 700 L340 500 L540 500 L540 300 L740 300 L740 100 L835 100"/>
        </svg>
        <span class="pin"></span>
        <span class="car"></span>
      </div>
    </div>
    <div class="hud"><b>GPS</b> Sundown Point · <i></i></div>
    <p class="arrived">You have arrived<small>offset-path + scroll() · 0 lines of JS</small></p>
    <p class="hint">SCROLL TO DRIVE ↓</p>
  </section>
</body>
</html>
